services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: readcode
      POSTGRES_USER: readcode
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readcode -d readcode"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://readcode:localdev@postgres:5432/readcode
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MODELS:
      ANTHROPIC_API_KEY:
      ANTHROPIC_MODELS:
      GEMINI_API_KEY:
      GEMINI_MODELS:
      GROQ_API_KEY:
      GROQ_MODELS:
      XAI_API_KEY:
      XAI_MODELS:
      ALLOWED_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1,api
      OAUTH_APP_ORIGIN: ${OAUTH_APP_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      WORKSPACE_DIR: /srv/data/workspaces
      WORKSPACE_AGENTS:
    volumes:
      - workspace_data:/srv/data/workspaces
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  workspace_data:
